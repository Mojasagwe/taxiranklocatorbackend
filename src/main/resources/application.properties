# CI/CD pipeline is now configured for this application

spring.application.name=taxi-rank-backend

# Admin Configuration
app.admin.auto-create=false
app.admin.email=admin@taxirank.com
app.admin.password=password123

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/taxiranktest_db
spring.datasource.username=postgres
spring.datasource.password=Naledi_brooklyn23
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only validates it
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwtSecret=9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a7c4d1b6e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0
app.jwtExpirationInMs=86400000


# Show Hibernate SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# One-time token for creating the first super admin (POST /api/auth/register/super-admin, header X-Bootstrap-Token).
# Unset = bootstrap disabled. Set it only until the first super admin exists.
app.bootstrap.super-admin-token=${SUPER_ADMIN_BOOTSTRAP_TOKEN:}

# Profile photos: 5 MB per photo (ProfilePhotoServiceImpl re-checks). Stored on local disk until S3.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.storage.photos-dir=${TRAVY_PHOTOS_DIR:${user.home}/.travy/photos}
